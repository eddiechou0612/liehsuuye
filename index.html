<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 藝術家作品集 | [您的名字]</title>
    <style>
        /* --- 基礎設定與字體 --- */
        :root {
            --bg-color: #ffffff; /* 背景色改為白色，更清爽 */
            --text-color: #333;
            --accent-color: #7a7a7a;
            --shadow-light: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* --- 頁首與介紹 --- */
        header {
            text-align: center;
            padding: 80px 20px 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .bio {
            color: #666;
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .social-links a {
            margin: 0 12px;
            text-decoration: none;
            color: var(--accent-color);
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .social-links a:hover {
            color: #000;
        }

        /* --- 分類導航 (Collections) --- */
        .filter-nav {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            margin-bottom: 40px;
        }

        .filter-btn {
            background: none;
            border: 1px solid transparent;
            cursor: pointer;
            margin: 0 12px;
            font-size: 1rem;
            color: var(--text-color);
            padding: 8px 15px;
            transition: 0.3s;
            border-radius: 20px;
        }

        .filter-btn:hover {
            background-color: #f0f0f0;
        }

        .filter-btn.active {
            background-color: #333;
            color: #fff;
        }

        /* --- 畫廊網格 (Masonry Layout) --- */
        .gallery-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            column-count: 3; 
            column-gap: 20px;
        }

        @media (max-width: 1024px) {
            .gallery-container { column-count: 2; }
        }
        @media (max-width: 600px) {
            .gallery-container { column-count: 1; }
        }

        .art-item {
            margin-bottom: 20px;
            break-inside: avoid; /* 避免圖片中斷 */
            position: relative;
            cursor: pointer;
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }
        .art-item.hide {
            opacity: 0;
            height: 0;
            overflow: hidden;
            margin-bottom: 0;
            transition: opacity 0.4s ease-out, height 0.4s, margin-bottom 0.4s;
        }

        .art-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            box-shadow: var(--shadow-light);
        }

        /* --- 燈箱 (Lightbox) 為了展示放大圖 --- */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.98); /* 接近全白背景 */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 80vh;
            width: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .lightbox-caption {
            margin-top: 15px;
            color: #555;
            font-size: 1rem;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            cursor: pointer;
            color: #333;
            transition: color 0.3s;
        }
        .close-btn:hover {
            color: #f00;
        }

        footer {
            text-align: center;
            padding: 60px 20px;
            font-size: 0.85rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>
        <h1>[您的名字 / 藝術家名稱]</h1>
        <p class="bio">視覺藝術家 | 插畫 | 設計 | 歡迎來到我的線上作品集</p>
        <div class="social-links">
            <a href="#">Instagram</a>
            <a href="#">ArtStation</a>
            <a href="#">Email</a>
        </div>
    </header>

    <nav class="filter-nav">
        <button class="filter-btn active" data-category="all">全部</button>
        <button class="filter-btn" data-category="sketch">素描/速寫</button>
        <button class="filter-btn" data-category="oil">油畫</button>
        <button class="filter-btn" data-category="digital">電繪/概念圖</button>
    </nav>

    <div class="gallery-container" id="gallery-container">
        
        <div class="art-item oil" data-caption="抽象風景：藍與灰的對話">
            <img src="https://images.unsplash.com/photo-1579783902614-a3fb39279623?w=600" alt="抽象風景：藍與灰的對話">
        </div>

        <div class="art-item sketch" data-caption="人物速寫：街角的陌生人">
            <img src="https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?w=600" alt="人物速寫：街角的陌生人">
        </div>

        <div class="art-item digital" data-caption="星艦概念設計圖">
            <img src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=600" alt="星艦概念設計圖">
        </div>

        <div class="art-item oil" data-caption="日出前的海岸線">
            <img src="https://images.unsplash.com/photo-1579783483458-832822d992d5?w=600" alt="日出前的海岸線">
        </div>
        
        <div class="art-item sketch" data-caption="靜物素描：蘋果與花瓶">
            <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=600" alt="靜物素描：蘋果與花瓶">
        </div>
        
        </div>

    <footer>
        &copy; 2024 Art Portfolio. All rights reserved.
    </footer>

    <div class="lightbox" id="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="放大圖片">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>

    <script>
        // --- 核心 JavaScript 邏輯 ---

        // 1. 篩選功能
        document.querySelectorAll('.filter-btn').forEach(button => {
            button.addEventListener('click', function() {
                const category = this.getAttribute('data-category');
                filterSelection(category);
            });
        });

        function filterSelection(category) {
            const items = document.getElementsByClassName("art-item");
            const btns = document.getElementsByClassName("filter-btn");

            // 按鈕樣式切換
            for (let i = 0; i < btns.length; i++) {
                btns[i].classList.remove("active");
            }
            document.querySelector(`.filter-btn[data-category="${category}"]`).classList.add("active");

            // 顯示/隱藏圖片
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                // 檢查項目是否有目標類別，或目標是 'all'
                if (category === "all" || item.classList.contains(category)) {
                    item.classList.remove("hide");
                } else {
                    item.classList.add("hide");
                }
            }
        }

        // 2. 燈箱功能
        document.querySelectorAll('.art-item').forEach(item => {
            item.addEventListener('click', function() {
                openLightbox(this);
            });
        });

        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const caption = document.getElementById("lightbox-caption");

        function openLightbox(element) {
            const img = element.querySelector("img");
            const imgCaption = element.getAttribute("data-caption") || img.alt;

            lightbox.style.display = "flex";
            lightboxImg.src = img.src;
            caption.innerHTML = imgCaption; 
        }

        function closeLightbox() {
            lightbox.style.display = "none";
        }
        
        // 點擊燈箱背景關閉
        lightbox.addEventListener('click', function(e) {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });

        // 預設載入時顯示所有作品
        document.addEventListener('DOMContentLoaded', () => {
            filterSelection('all');
        });
        
    </script>

</body>
</html>
