backend:
  name: github
  repo: eddiechou0612/liehsuuye # ❗️ 替換成您的 GitHub 專案路徑 (例: myname/art-portfolio)
  branch: main # 確保您的分支名稱正確 (main 或 master)

# *** 這是 OAuth 登入的配置 ***
oauth:
  provider: github
  # ❗️ 替換成您在步驟一獲取的 Client ID
  client_id: Ov23liLQsztT846t2eB5
  auth_url: https://github.com/login/oauth/authorize
  token_url: https://github.com/login/oauth/access_token
  base_url: https://github.com/
  auth_scope: repo, user # 授予讀寫倉庫和使用者資訊的權限

# ========== ❗️ 修正處從這裡開始 ❗️ ==========

# 定義圖片媒體庫
media_library:
  name: uploadcare
  config:
    multiple: true
    public_key: 'demopublickey' # 這是演示金鑰，實際使用中您會使用 Netlify 設置

# 設置圖片上傳路徑
media_folder: "images/uploads"     # 圖片檔案將會上傳到 GitHub 專案根目錄下的 images/uploads 資料夾
public_folder: "/images/uploads"   # 圖片在網頁上引用的公共路徑

# ========== ❗️ 修正處結束 ❗️ ==========

# 作品集設定 (保持不變)
collections:
  - name: "works"
    label: "作品集"
    files:
      - name: "gallery"
        label: "作品列表"
        file: "gallery.json"
        fields:
          - name: "works"
            label: "作品"
            widget: "list" 
            fields:
              - {label: "作品標題", name: "title", widget: "string"}
              - {label: "分類", name: "category", widget: "select", options: ["oil", "sketch", "digital"]}
              - {label: "圖片", name: "image", widget: "image"}
