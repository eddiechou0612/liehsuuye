# admin/config.yml
backend:
  name: github
  repo: your-username/your-repo-name # 替換成您的 GitHub 專案名稱 (例如: myname/art-portfolio)
  branch: main # 確保與您的主分支名稱一致

# *** 新增下方 oauth 區塊 ***
oauth:
  provider: github
  client_id: Ov23liLQsztT846t2eB5 # 替換成步驟 A 獲取的 Client ID
  auth_url: https://github.com/login/oauth/authorize
  token_url: https://github.com/login/oauth/access_token
  base_url: https://github.com/
  auth_scope: repo, user

# Media and Collections settings remain the same...
media_folder: "images/uploads"
public_folder: "images/uploads"
# ... (下方接續您的 works collection 設定)
collections:
  - name: "works"
    label: "作品集"
    # ...
